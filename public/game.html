<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app-container">
    <header class="header">
        <h1 class="title">2048</h1>
        <p>Управление — стрелками. Все ходы и очки проверяет сервер.</p>
        <div class="scores-container">
            <div class="score-container">Счёт: 0</div>
            <div class="best-container">Рекорд: 0</div>
            <div class="coins-container">Монеты: <span id="coins">0</span></div>
        </div>
        <div class="button-container">
            <a class="home" href="/">Главная</a>
            <button class="button" id="new-game-button" type="button">Новая игра</button>
            <button class="button button-secondary" id="clear-row-button" type="button">Очистить ряд · 50</button>
        </div>
    </header>

    <section class="game-container" aria-label="Игровое поле 2048">
        <div class="grid-container"></div>
    </section>
    <div class="game-over-message" role="status">Ходов больше нет</div>
</main>

<script src="script.js"></script>
</body>
</html>
